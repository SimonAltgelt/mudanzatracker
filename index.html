const MK = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
const MONTH_NAMES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const fmtUSD = n => `$${n.toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0})}`;
const fmtARS = n => `$${n.toLocaleString("es-AR")}`;
const monthsBetween = (a,b) => (b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();
const PRIORITY_LABELS = {indispensable:"🟠 Indispensable",ultimo:"🟧 Último momento",noind:"🟢 No indispensable",inmobiliaria:"🔴 Inmobiliaria"};
const PRIORITY_ORDER = ["indispensable","ultimo","inmobiliaria","noind"];

const SB_URL = "https://tuofgimokqkcjbljacsh.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1b2ZnaW1va3FrY2pibGphY3NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNjQ5NjAsImV4cCI6MjEwMjc0MDk2MH0.95W6Yp-HwkEMOZSSib6W9khQrxzcl5EWZUKtpGKBuI4";
const SB_HEADERS = { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, "Content-Type": "application/json" };

const storage = {
  async getAll() {
    try {
      const res = await fetch(`${SB_URL}/rest/v1/app_data?select=key,value`, { headers: SB_HEADERS });
      if (!res.ok) throw new Error(res.statusText);
      const rows = await res.json();
      const map = {};
      rows.forEach(r => { map[r.key] = r.value; });
      return map;
    } catch { return {}; }
  },
  async set(k, v) {
    try {
      await fetch(`${SB_URL}/rest/v1/app_data`, {
        method: "POST",
        headers: { ...SB_HEADERS, Prefer: "resolution=merge-duplicates" },
        body: JSON.stringify({ key: k, value: v, updated_at: new Date().toISOString() })
      });
    } catch {}
  }
};

function getProjection(savings, config, fixedUSD, monthsData) {
  const now = new Date();
  const months = monthsBetween(now, TARGET.date);
  let total = savings;
  for (let i = 1; i <= months; i++) {
    const m = new Date(now.getFullYear(), now.getMonth() + i, 1);
    const mk = MK(m);
    const actual = monthsData[mk];
    if (actual && actual.closed) {
      total += actual.savedUSD || 0;
    } else {
      let sal = config.salary;
      if (m >= new Date(2027, 1, 1)) sal += config.febRaise;
      const hasMonotributo = mk >= "2026-09";
      const fixedTotal = hasMonotributo ? fixedUSD : fixedUSD - (140000 / config.dollarRate);
      const extraThisMonth = EXTRAS.filter(e => e.month === mk).reduce((s,e) => s + e.amount, 0);
      total += sal - fixedTotal - 250 - (extraThisMonth / config.dollarRate);
      if (m.getMonth() === 11 && m.getFullYear() === 2026) total += config.endYearBonus;
    }
  }
  return Math.round(total);
}

function getMood(projected, target) {
  const r = projected / target;
  if (r >= 1.20) return { emoji: "😎", text: "Vas sobrado, podés darte algún gusto", color: "#4ade80", bg: "#052e16", level: 5 };
  if (r >= 1.05) return { emoji: "😊", text: "Bien encaminado, no aflojes", color: "#86efac", bg: "#052e16", level: 4 };
  if (r >= 0.95) return { emoji: "😐", text: "Vas justo, cada gasto cuenta", color: "#fbbf24", bg: "#422006", level: 3 };
  if (r >= 0.85) return { emoji: "😟", text: "Estás apretado, recortá lo que puedas", color: "#fb923c", bg: "#431407", level: 2 };
  return { emoji: "😡", text: "Así no llegás a abril, hay que frenar", color: "#ef4444", bg: "#450a0a", level: 1 };
}

function getTip(mood, thisMonthTotal, category) {
  if (category === "uber") {
    if (mood.level <= 1) return "🚫 Cada uber te aleja de abril. ¿Podés usar la moto?";
    if (mood.level <= 3) return "🏍️ Los ubers suman rápido. Priorizá la moto.";
    return "✅ Anotado. Todavía tenés margen.";
  }
  if (mood.level <= 1) return "⚠️ Estás gastando demasiado. Frená todo lo que puedas.";
  if (mood.level <= 3) return "📉 Este gasto aprieta. ¿Era necesario?";
  return "✅ Registrado.";
}

function App() {
  const [tab, setTab] = useState(0);
  const [loading, setLoading] = useState(true);
  const [config, setConfig] = useState({ ...DEFAULTS });
  const [savings, setSavings] = useState(DEFAULTS.savings);
  const [expenses, setExpenses] = useState({});
  const [fixedPaid, setFixedPaid] = useState({});
  const [fixedAmts, setFixedAmts] = useState({});
  const [purchased, setPurchased] = useState({});
  const [monthsData, setMonthsData] = useState({});
  const [toast, setToast] = useState(null);
  const [form, setForm] = useState({ amount: "", cat: "general", desc: "" });
  const [fixedOpen, setFixedOpen] = useState(false);
  const [editSavings, setEditSavings] = useState(false);
  const [savingsInput, setSavingsInput] = useState("");
  const [editRate, setEditRate] = useState(false);
  const [rateInput, setRateInput] = useState("");
  const [editTarget, setEditTarget] = useState(false);
  const [targetInput, setTargetInput] = useState("");

  useEffect(() => {
    (async () => {
      const all = await storage.getAll();
      setConfig(all["mtz-config"] || DEFAULTS);
      setSavings(all["mtz-savings"] ?? DEFAULTS.savings);
      setExpenses(all["mtz-expenses"] || {});
      setFixedPaid(all["mtz-fixedpaid"] || {});
      setFixedAmts(all["mtz-fixedamts"] || {});
      setPurchased(all["mtz-purchased"] || {});
      setMonthsData(all["mtz-monthsdata"] || {});
      setLoading(false);
    })();
  }, []);

  const save = (key, setter) => async (val) => { setter(val); await storage.set(key, val); };
  const saveSavings = save("mtz-savings", setSavings);
  const saveExpenses = save("mtz-expenses", setExpenses);
  const saveFixedPaid = save("mtz-fixedpaid", setFixedPaid);
  const saveFixedAmts = save("mtz-fixedamts", setFixedAmts);
  const savePurchased = save("mtz-purchased", setPurchased);
  const saveConfig = async (nc) => { setConfig(nc); await storage.set("mtz-config", nc); };

  const cm = MK();
  const cmExpenses = expenses[cm] || [];
  const now = new Date();
  const monthsLeft = monthsBetween(now, TARGET.date);
  const targetAmt = config.targetAmount || DEFAULTS.targetAmount;

  const activeFixed = FIXED_EXP.filter(f => !f.start || cm >= f.start);
  const totalFixedARS = activeFixed.reduce((s, f) => {
    if (f.variable) return s + (fixedAmts[cm]?.[f.id] ?? f.amount);
    return s + f.amount;
  }, 0);
  const totalFixedUSD = totalFixedARS / config.dollarRate;
  const totalVarARS = cmExpenses.reduce((s, e) => s + e.amount, 0);
  const totalVarUSD = totalVarARS / config.dollarRate;
  const totalMonthARS = totalFixedARS + totalVarARS;
  const totalMonthUSD = totalMonthARS / config.dollarRate;

  const projected = getProjection(savings, config, totalFixedUSD, monthsData);
  const mood = getMood(projected, targetAmt);
  const surplus = projected - targetAmt;

  const remainingItemsCost = MOVE_ITEMS.filter(i => !purchased[i.id]).reduce((s, i) => s + i.cost, 0);
  const purchasedCount = MOVE_ITEMS.filter(i => purchased[i.id]).length;

  const addExpense = async () => {
    const amt = parseFloat(form.amount);
    if (!amt || amt <= 0) return;
    const entry = { id: Date.now(), amount: amt, cat: form.cat, desc: form.desc || form.cat, date: new Date().toISOString() };
    const updated = { ...expenses, [cm]: [...cmExpenses, entry] };
    await saveExpenses(updated);
    setToast(getTip(mood, totalVarARS + amt, form.cat));
    setForm({ amount: "", cat: "general", desc: "" });
    setTimeout(() => setToast(null), 3500);
  };

  const removeExpense = async (id) => {
    const updated = { ...expenses, [cm]: cmExpenses.filter(e => e.id !== id) };
    await saveExpenses(updated);
  };

  const toggleFixed = async (fid) => {
    const mp = fixedPaid[cm] || {};
    const updated = { ...fixedPaid, [cm]: { ...mp, [fid]: !mp[fid] } };
    await saveFixedPaid(updated);
  };

  const updateFixedAmt = async (fid, val) => {
    const ma = fixedAmts[cm] || {};
    const updated = { ...fixedAmts, [cm]: { ...ma, [fid]: parseFloat(val) || 0 } };
    await saveFixedAmts(updated);
  };

  const togglePurchased = async (iid) => {
    const updated = { ...purchased, [iid]: !purchased[iid] };
    await savePurchased(updated);
  };

  const progressPct = Math.min(100, Math.round((savings / targetAmt) * 100));
  const projPct = Math.min(100, Math.round((projected / targetAmt) * 100));

  if (loading) return (
    <div className="flex items-center justify-center h-screen bg-gray-950 text-gray-300">
      <div className="text-center"><div className="text-5xl mb-3 animate-pulse">🏠</div><p className="text-lg">Cargando...</p></div>
    </div>
  );

  const Card = ({ children, className = "", style }) => (
    <div className={`bg-gray-900 rounded-2xl p-4 ${className}`} style={style}>{children}</div>
  );

  const EditableField = ({ value, label, onSave, prefix = "$" }) => {
    const [editing, setEditing] = useState(false);
    const [input, setInput] = useState("");
    return editing ? (
      <input type="number" value={input} onChange={e => setInput(e.target.value)}
        onBlur={() => { const v = parseFloat(input); if (v > 0) onSave(v); setEditing(false); }}
        className="bg-gray-800 text-white rounded px-2 py-1 w-28 text-lg" autoFocus />
    ) : (
      <p className="text-white text-xl font-bold cursor-pointer" onClick={() => { setInput(String(value)); setEditing(true); }}>
        {prefix}{value.toLocaleString("es-AR")} <span className="text-gray-600 text-sm">✏️</span>
      </p>
    );
  };

  const renderDashboard = () => (
    <div className="space-y-4 pb-24">
      <Card className="text-center py-6" style={{ background: mood.bg }}>
        <div className="text-7xl mb-2" style={{filter:"drop-shadow(0 0 20px "+mood.color+"40)"}}>{mood.emoji}</div>
        <p className="text-lg font-semibold" style={{ color: mood.color }}>{mood.text}</p>
        <p className="text-gray-400 text-sm mt-1">{monthsLeft} meses para abril 2027</p>
      </Card>

      <Card>
        <div className="flex justify-between text-sm mb-2">
          <span className="text-gray-400">Ahorro actual</span>
          <span className="text-white font-bold">{fmtUSD(savings)}</span>
        </div>
        <div className="w-full bg-gray-800 rounded-full h-3 mb-1">
          <div className="h-3 rounded-full transition-all" style={{ width: `${progressPct}%`, background: mood.color }} />
        </div>
        <div className="flex justify-between text-xs text-gray-500">
          <span>{progressPct}%</span>
          <span>Meta: {editTarget ? (
            <input type="number" value={targetInput} onChange={e => setTargetInput(e.target.value)}
              onBlur={() => { const v = parseFloat(targetInput); if (v > 0) saveConfig({ ...config, targetAmount: v }); setEditTarget(false); }}
              className="bg-gray-800 text-white rounded px-1 w-20 text-xs inline" autoFocus />
          ) : (
            <span className="cursor-pointer" onClick={() => { setTargetInput(String(targetAmt)); setEditTarget(true); }}>
              {fmtUSD(targetAmt)} ✏️
            </span>
          )}</span>
        </div>
        <div className="mt-4 flex justify-between text-sm">
          <span className="text-gray-400">Proyección a abril</span>
          <span className="font-bold" style={{ color: mood.color }}>{fmtUSD(projected)}</span>
        </div>
        <div className="w-full bg-gray-800 rounded-full h-3 mb-1 mt-2">
          <div className="h-3 rounded-full transition-all" style={{ width: `${projPct}%`, background: surplus >= 0 ? "#4ade80" : "#ef4444" }} />
        </div>
        <p className="text-xs mt-1" style={{ color: surplus >= 0 ? "#86efac" : "#fca5a5" }}>
          {surplus >= 0 ? `Colchón: ${fmtUSD(surplus)}` : `Te faltan: ${fmtUSD(Math.abs(surplus))}`}
        </p>
      </Card>

      <div className="grid grid-cols-2 gap-3">
        <Card>
          <p className="text-gray-500 text-xs">Gastado este mes</p>
          <p className="text-white text-lg font-bold">{fmtARS(totalMonthARS)}</p>
          <p className="text-gray-500 text-xs">≈ {fmtUSD(Math.round(totalMonthUSD))} USD</p>
        </Card>
        <Card>
          <p className="text-gray-500 text-xs">Ahorro estimado mes</p>
          <p className="text-lg font-bold" style={{ color: (config.salary - totalMonthUSD) > 600 ? "#4ade80" : "#fbbf24" }}>
            {fmtUSD(Math.round(config.salary - totalMonthUSD))}
          </p>
        </Card>
        <Card>
          <p className="text-gray-500 text-xs">Falta comprar</p>
          <p className="text-white text-lg font-bold">{fmtUSD(remainingItemsCost)}</p>
          <p className="text-gray-500 text-xs">{purchasedCount}/{MOVE_ITEMS.length} comprados</p>
        </Card>
        <Card>
          <p className="text-gray-500 text-xs">Dólar</p>
          <EditableField value={config.dollarRate} onSave={v => saveConfig({...config, dollarRate: v})} prefix="$" />
        </Card>
      </div>

      <Card>
        <div className="flex items-center justify-between">
          <div>
            <p className="text-gray-500 text-xs">Ahorros actuales (USD)</p>
            <EditableField value={savings} onSave={v => saveSavings(v)} prefix="$" />
          </div>
          <p className="text-gray-600 text-xs text-right">Tocá para<br/>actualizar</p>
        </div>
      </Card>

      <Card>
        <p className="text-gray-400 text-sm font-medium mb-3">Proyección mensual</p>
        {(() => {
          let running = savings;
          const rows = [];
          for (let i = 1; i <= monthsLeft; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
            let sal = config.salary;
            if (d >= new Date(2027, 1, 1)) sal += config.febRaise;
            const hasMono = MK(d) >= "2026-09";
            const fix = hasMono ? totalFixedUSD : totalFixedUSD - (140000 / config.dollarRate);
            const mk = MK(d);
            const extraARS = EXTRAS.filter(e => e.month === mk).reduce((s,e) => s + e.amount, 0);
            let monthSave = sal - fix - 250 - (extraARS / config.dollarRate);
            if (d.getMonth() === 11 && d.getFullYear() === 2026) monthSave += config.endYearBonus;
            running += monthSave;
            const pct = Math.min(100, Math.round((running / targetAmt) * 100));
            const isBonus = d.getMonth() === 11 && d.getFullYear() === 2026;
            const hasExtra = extraARS > 0;
            rows.push(
              <div key={i} className="flex items-center gap-2 text-xs mb-1.5">
                <span className="text-gray-500 w-14">{MONTH_NAMES[d.getMonth()]} {String(d.getFullYear()).slice(2)}</span>
                <div className="flex-1 bg-gray-800 rounded-full h-2">
                  <div className="h-2 rounded-full transition-all"
                    style={{ width: `${pct}%`, background: running >= targetAmt ? "#4ade80" : "#fbbf24" }} />
                </div>
                <span className="text-gray-400 w-16 text-right">{fmtUSD(Math.round(running))}</span>
                {isBonus && <span className="text-yellow-400">🎁</span>}
                {hasExtra && <span className="text-red-400">🎁</span>}
              </div>
            );
          }
          return rows;
        })()}
        <div className="border-t border-gray-800 mt-2 pt-2 flex justify-between text-xs">
          <span className="text-gray-500">Meta</span>
          <span className="text-green-400 font-medium">{fmtUSD(targetAmt)}</span>
        </div>
      </Card>
    </div>
  );

  const renderGastos = () => (
    <div className="space-y-4 pb-24">
      <Card>
        <p className="text-gray-400 text-sm mb-1">{MONTH_NAMES[now.getMonth()]} {now.getFullYear()}</p>
        <p className="text-white text-2xl font-bold">{fmtARS(totalMonthARS)}</p>
        <p className="text-gray-500 text-xs">≈ {fmtUSD(Math.round(totalMonthUSD))} USD</p>
      </Card>

      <Card>
        <p className="text-gray-300 text-sm font-medium mb-3">Agregar gasto</p>
        <div className="flex gap-2 mb-3">
          {[["uber","🚗 Uber"],["general","🛒 General"]].map(([v,l]) => (
            <button key={v} onClick={() => setForm(f => ({...f, cat: v}))}
              className={`flex-1 py-2 rounded-xl text-sm font-medium transition-all ${form.cat === v ? "bg-indigo-600 text-white" : "bg-gray-800 text-gray-400"}`}>
              {l}
            </button>
          ))}
        </div>
        <input type="number" inputMode="numeric" placeholder="Monto (ARS)" value={form.amount}
          onChange={e => setForm(f => ({...f, amount: e.target.value}))}
          className="w-full bg-gray-800 text-white rounded-xl px-4 py-3 mb-2 text-lg placeholder-gray-600 border-none outline-none" />
        <input type="text" placeholder="Descripción (opcional)" value={form.desc}
          onChange={e => setForm(f => ({...f, desc: e.target.value}))}
          className="w-full bg-gray-800 text-white rounded-xl px-4 py-2.5 mb-3 text-sm placeholder-gray-600 border-none outline-none" />
        <button onClick={addExpense}
          className="w-full bg-indigo-600 active:bg-indigo-500 text-white py-3 rounded-xl font-medium transition-all active:scale-95">
          Agregar
        </button>
      </Card>

      {toast && (
        <div className="bg-gray-800 border border-gray-700 rounded-xl p-3 text-sm text-gray-300 animate-pulse">{toast}</div>
      )}

      <Card>
        <button onClick={() => setFixedOpen(!fixedOpen)}
          className="w-full flex items-center justify-between text-gray-300 font-medium">
          <span>📌 Gastos fijos ({fmtARS(totalFixedARS)})</span>
          <span className="text-xl text-gray-500">{fixedOpen ? "▾" : "▸"}</span>
        </button>
        {fixedOpen && (
          <div className="mt-3 space-y-2">
            {activeFixed.map(f => {
              const paid = fixedPaid[cm]?.[f.id];
              return (
                <div key={f.id} className="flex items-center gap-3 py-2 border-b border-gray-800 last:border-0">
                  <button onClick={() => toggleFixed(f.id)}
                    className={`w-6 h-6 rounded-md flex items-center justify-center text-xs transition-all flex-shrink-0 ${paid ? "bg-green-600" : "bg-gray-800 border border-gray-600"}`}>
                    {paid && "✓"}
                  </button>
                  <div className="flex-1 min-w-0">
                    <p className={`text-sm ${paid ? "text-gray-500 line-through" : "text-gray-200"}`}>{f.name}</p>
                  </div>
                  {f.variable ? (
                    <input type="number" inputMode="numeric" value={fixedAmts[cm]?.[f.id] ?? f.amount}
                      onChange={e => updateFixedAmt(f.id, e.target.value)}
                      className="bg-gray-800 text-white rounded px-2 py-1 w-28 text-sm text-right border-none outline-none" />
                  ) : (
                    <span className="text-gray-400 text-sm">{fmtARS(f.amount)}</span>
                  )}
                </div>
              );
            })}
            <div className="pt-2 flex justify-between text-sm">
              <span className="text-gray-500">Total fijos en USD</span>
              <span className="text-gray-300">≈ {fmtUSD(Math.round(totalFixedUSD))}</span>
            </div>
          </div>
        )}
      </Card>

      {cmExpenses.length > 0 && (
        <Card>
          <p className="text-gray-400 text-sm font-medium mb-3">Gastos del mes</p>
          <div className="space-y-2">
            {[...cmExpenses].reverse().map(e => (
              <div key={e.id} className="flex items-center justify-between py-1.5 border-b border-gray-800 last:border-0">
                <div className="flex items-center gap-2">
                  <span className="text-sm">{e.cat === "uber" ? "🚗" : "🛒"}</span>
                  <div>
                    <p className="text-gray-200 text-sm">{e.desc}</p>
                    <p className="text-gray-600 text-xs">{new Date(e.date).toLocaleDateString("es-AR")}</p>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-gray-300 text-sm">{fmtARS(e.amount)}</span>
                  <button onClick={() => removeExpense(e.id)} className="text-gray-600 active:text-red-400 text-xs p-1">✕</button>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-3 pt-2 border-t border-gray-800 space-y-1">
            {["uber","general"].map(cat => {
              const total = cmExpenses.filter(e => e.cat === cat).reduce((s,e) => s + e.amount, 0);
              if (!total) return null;
              return (
                <div key={cat} className="flex justify-between text-xs">
                  <span className="text-gray-500">{cat === "uber" ? "🚗 Uber" : "🛒 General"}</span>
                  <span className="text-gray-400">{fmtARS(total)}</span>
                </div>
              );
            })}
            <div className="flex justify-between text-sm font-medium pt-1">
              <span className="text-gray-400">Total variable</span>
              <span className="text-white">{fmtARS(totalVarARS)}</span>
            </div>
          </div>
        </Card>
      )}
    </div>
  );

  const renderMudanza = () => {
    const rooms = [...new Set(MOVE_ITEMS.map(i => i.room))];
    return (
      <div className="space-y-4 pb-24">
        <Card>
          <div className="flex justify-between items-center">
            <div>
              <p className="text-gray-500 text-xs">Falta comprar</p>
              <p className="text-white text-2xl font-bold">{fmtUSD(remainingItemsCost)}</p>
            </div>
            <div className="text-right">
              <p className="text-gray-500 text-xs">Progreso</p>
              <p className="text-green-400 text-lg font-bold">{purchasedCount}/{MOVE_ITEMS.length}</p>
            </div>
          </div>
          <div className="w-full bg-gray-800 rounded-full h-2 mt-3">
            <div className="h-2 rounded-full bg-green-500 transition-all"
              style={{ width: `${Math.round((purchasedCount / MOVE_ITEMS.length) * 100)}%` }} />
          </div>
        </Card>

        <Card>
          <p className="text-gray-400 text-sm font-medium mb-2">Por prioridad (pendientes)</p>
          {PRIORITY_ORDER.map(p => {
            const items = MOVE_ITEMS.filter(i => i.p === p && !purchased[i.id]);
            const total = items.reduce((s, i) => s + i.cost, 0);
            if (!total) return null;
            return (
              <div key={p} className="flex justify-between text-sm py-1">
                <span className="text-gray-400">{PRIORITY_LABELS[p]}</span>
                <span className="text-gray-200">{fmtUSD(total)}</span>
              </div>
            );
          })}
        </Card>

        {rooms.map(room => {
          const items = MOVE_ITEMS.filter(i => i.room === room);
          const done = items.filter(i => purchased[i.id]);
          return (
            <Card key={room}>
              <div className="flex justify-between items-center mb-3">
                <p className="text-gray-200 font-medium">{room}</p>
                <span className="text-xs text-gray-500">{done.length}/{items.length}</span>
              </div>
              <div className="space-y-1.5">
                {items.sort((a,b) => (purchased[a.id]?1:0)-(purchased[b.id]?1:0)).map(item => (
                  <div key={item.id} className="flex items-center gap-3 py-1.5">
                    <button onClick={() => togglePurchased(item.id)}
                      className={`w-6 h-6 rounded flex items-center justify-center text-xs flex-shrink-0 transition-all ${purchased[item.id] ? "bg-green-600" : "bg-gray-800 border border-gray-600"}`}>
                      {purchased[item.id] && "✓"}
                    </button>
                    <span className={`flex-1 text-sm ${purchased[item.id] ? "text-gray-600 line-through" : "text-gray-200"}`}>
                      {item.name}
                    </span>
                    <span className={`text-sm ${purchased[item.id] ? "text-gray-700" : "text-gray-400"}`}>{fmtUSD(item.cost)}</span>
                    <span className="text-xs">{item.p === "indispensable" ? "🟠" : item.p === "ultimo" ? "🟧" : item.p === "inmobiliaria" ? "🔴" : "🟢"}</span>
                  </div>
                ))}
              </div>
            </Card>
          );
        })}
      </div>
    );
  };

  const tabs = [
    { icon: "📊", label: "Dashboard" },
    { icon: "💸", label: "Gastos" },
    { icon: "📦", label: "Mudanza" },
  ];

  return (
    <div className="min-h-screen bg-gray-950 text-white max-w-lg mx-auto">
      <div className="sticky top-0 z-30 bg-gray-950/95 backdrop-blur-sm border-b border-gray-800 px-4 py-3">
        <div className="flex items-center justify-between">
          <div>
            <h1 className="text-lg font-bold">🏠 Mudanza 2027</h1>
            <p className="text-xs text-gray-500">{monthsLeft} meses para abril</p>
          </div>
          <div className="text-3xl">{mood.emoji}</div>
        </div>
      </div>
      <div className="px-4 pt-4">
        {tab === 0 && renderDashboard()}
        {tab === 1 && renderGastos()}
        {tab === 2 && renderMudanza()}
      </div>
      <div className="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur-sm border-t border-gray-800 z-30">
        <div className="flex max-w-lg mx-auto">
          {tabs.map((t, i) => (
            <button key={i} onClick={() => setTab(i)}
              className={`flex-1 py-3 flex flex-col items-center gap-0.5 transition-all ${tab === i ? "text-indigo-400" : "text-gray-500"}`}>
              <span className="text-xl">{t.icon}</span>
              <span className="text-xs">{t.label}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
