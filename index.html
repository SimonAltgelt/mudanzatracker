function calcProjection(savings,cfg,customFixed,fixedAmts,customEvents){
  const now=new Date();const cm=MK();const months=mBtw(now,TARGET.date);
  const allFixed=[...PRESET_FIXED,...(customFixed||[])];
  let total=savings;
  const timeline=[];
  for(let i=1;i<=months;i++){
    const d=new Date(now.getFullYear(),now.getMonth()+i,1);
    const mk=MK(d);
    let sal=cfg.salary;
    if(d>=new Date(2027,1,1))sal+=cfg.febRaise;
    const activeF=allFixed.filter(f=>!f.start||mk>=f.start);
    const fixARS=activeF.reduce((s,f)=>{
      if(f.variable)return s+(fixedAmts[mk]?.[f.id]??f.amount);
      return s+f.amount;
    },0);
    const fixUSD=fixARS/cfg.dollarRate;
    const monthEvents=[...EXTRAS.filter(e=>e.month===mk).map(e=>({...e,custom:false})),...((customEvents&&customEvents[mk])||[]).map(e=>({...e,custom:true}))];
    const extraARS=monthEvents.reduce((s,e)=>s+e.amount,0);
    const extraUSD=extraARS/cfg.dollarRate;
    const saved=sal-fixUSD-250-extraUSD;
    const isBonus=d.getMonth()===11&&d.getFullYear()===2026;
    const monthTotal=saved+(isBonus?cfg.endYearBonus:0);
    total+=monthTotal;
    const hasMonotributo=mk>="2026-09";
    const hasRaise=d>=new Date(2027,1,1);
    timeline.push({month:mk,label:`${MN[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`,saved:Math.round(monthTotal),accumulated:Math.round(total),isBonus,hasExtra:extraARS!==0,extraDesc:monthEvents.map(e=>e.desc).join(", "),hasMonotributo,hasRaise,fixedUSD:Math.round(fixUSD),extraUSD:Math.round(extraUSD),events:monthEvents});
  }
  return{projected:Math.round(total),timeline};
}

const DEFAULT_THRESHOLDS={t5:1.20,t4:1.05,t3:0.95,t2:0.85};

function getMood(projected,target,th){
  th=th||DEFAULT_THRESHOLDS;
  const r=projected/target;
  if(r>=th.t5)return{emoji:"😎",text:"Vas sobrado, podés darte algún gusto",color:"#4ade80",bg:"#052e16",level:5};
  if(r>=th.t4)return{emoji:"😊",text:"Bien encaminado, no aflojes",color:"#86efac",bg:"#052e16",level:4};
  if(r>=th.t3)return{emoji:"😐",text:"Vas justo, cada gasto cuenta",color:"#fbbf24",bg:"#422006",level:3};
  if(r>=th.t2)return{emoji:"😟",text:"Estás apretado, recortá lo que puedas",color:"#fb923c",bg:"#431407",level:2};
  return{emoji:"😡",text:"Así no llegás a abril, hay que frenar",color:"#ef4444",bg:"#450a0a",level:1};
}

function getTip(mood,cat){
  if(cat==="uber"){
    if(mood.level<=1)return"🚫 Cada uber te aleja de abril. ¿Podés usar la moto?";
    if(mood.level<=3)return"🏍️ Los ubers suman. Priorizá la moto.";
    return"✅ Anotado, tenés margen.";
  }
  if(mood.level<=1)return"⚠️ Frená todo lo que puedas.";
  if(mood.level<=3)return"📉 ¿Era necesario?";
  return"✅ Registrado.";
}

// Editable value component - modern tap-to-edit
function Val({value,onSave,label,format,prefix="",suffix="",size="xl"}){
  const[editing,setEditing]=useState(false);
  const[input,setInput]=useState("");
  const ref=useRef();
  const doSave=()=>{const v=parseFloat(input);if(v>=0&&!isNaN(v)){onSave(v)}setEditing(false)};
  useEffect(()=>{if(editing&&ref.current)ref.current.focus()},[editing]);
  if(editing)return(
    <div className="slide-up">
      {label&&<p className="text-xs text-gray-500 mb-1">{label}</p>}
      <div className="flex items-center gap-2">
        <div className="flex-1 relative">
          {prefix&&<span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">{prefix}</span>}
          <input ref={ref} type="number" inputMode="decimal" value={input}
            onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")doSave()}}
            className={`w-full bg-gray-800 border-2 border-indigo-500 rounded-xl ${prefix?"pl-7":"pl-3"} pr-3 py-2.5 text-white text-${size} font-bold outline-none`}/>
        </div>
        <button onClick={doSave} className="bg-indigo-600 active:bg-indigo-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm shrink-0">OK</button>
        <button onClick={()=>setEditing(false)} className="text-gray-500 px-2 py-2.5 text-sm">✕</button>
      </div>
    </div>
  );
  const display=format?format(value):`${prefix}${value.toLocaleString("es-AR")}${suffix}`;
  return(
    <div onClick={()=>{setInput(String(value));setEditing(true)}}
      className="cursor-pointer group transition-all active:scale-[0.98]">
      {label&&<p className="text-xs text-gray-500 mb-0.5">{label}</p>}
      <p className={`text-${size} font-bold text-white group-active:text-indigo-400 transition-colors`}>{display}</p>
    </div>
  );
}

function Card({children,className="",style}){
  return <div className={`bg-gray-900 rounded-2xl p-4 ${className}`} style={style}>{children}</div>;
}

  const totalMonthARS=totalFixedARS+totalVarARS;
  const totalMonthUSD=totalMonthARS/cfg.dollarRate;

  const{projected,timeline}=calcProjection(savings,cfg,customFixed,fixedAmts,customEvents);
  const upcomingMonths=timeline.map(t=>({key:t.month,label:t.label}));
  const thresholds=cfg.moodThresholds||DEFAULT_THRESHOLDS;
  const mood=getMood(projected,targetAmt,thresholds);
  const moodRatio=projected/targetAmt;
  const surplus=projected-targetAmt;
  const remaining=targetAmt-savings;
  const requiredPerMonth=monthsLeft>0?Math.round(remaining/monthsLeft):remaining;
  const remainingItemsCost=MOVE_ITEMS.filter(i=>!purchased[i.id]).reduce((s,i)=>s+i.cost,0);
  const purchasedCount=MOVE_ITEMS.filter(i=>purchased[i.id]).length;

  const addExpense=async()=>{
    const amt=parseFloat(form.amount);if(!amt||amt<=0)return;
    const entry={id:Date.now(),amount:amt,cat:form.cat,desc:form.desc||form.cat,date:new Date().toISOString()};

    setToast(getTip(mood,form.cat));
    setForm({amount:"",cat:"general",desc:""});
    setTimeout(()=>setToast(null),3500);
  };
  const removeExpense=async id=>{await saveExpenses({...expenses,[cm]:cmExp.filter(e=>e.id!==id)})};
  const toggleFixed=async fid=>{const mp=fixedPaid[cm]||{};await saveFixedPaid({...fixedPaid,[cm]:{...mp,[fid]:!mp[fid]}})};

  const togglePurchased=async iid=>{await savePurchased({...purchased,[iid]:!purchased[iid]})};
  const addCustomFixed=async()=>{
    if(!newFixed.name||!newFixed.amount)return;

        </div>
        <p className="text-gray-600 text-xs mt-3">Tocá para ver el cálculo →</p>

      {/* MOOD DETAIL MODAL */}
      {showMoodDetail&&(

            </div>

            <div className="bg-gray-800 rounded-2xl p-4 mb-4 space-y-2">
              <div className="flex justify-between text-sm"><span className="text-gray-400">Ahorros actuales</span><span className="text-white font-medium">{fU(savings)}</span></div>

                    await saveCfg({...cfg,moodThresholds:nt});
                    setEditThresholds(false);
                  }} className="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-sm font-medium">Guardar</button>
                  <button onClick={()=>setEditThresholds(false)} className="px-4 text-gray-500 text-sm">Cancelar</button>
                </div>
                <button onClick={async()=>{await saveCfg({...cfg,moodThresholds:DEFAULT_THRESHOLDS});setEditThresholds(false)}} className="w-full text-gray-500 text-xs py-1">Restaurar valores por defecto</button>
              </div>
            ):(
              <div className="space-y-1.5">
                <div className="flex justify-between text-sm py-1"><span className="text-gray-400">😎 Sobrado</span><span className="text-gray-300">≥ {Math.round(thresholds.t5*100)}%</span></div>
                <div className="flex justify-between text-sm py-1"><span className="text-gray-400">😊 Bien</span><span className="text-gray-300">≥ {Math.round(thresholds.t4*100)}%</span></div>
                <div className="flex justify-between text-sm py-1"><span className="text-gray-400">😐 Justo</span><span className="text-gray-300">≥ {Math.round(thresholds.t3*100)}%</span></div>
                <div className="flex justify-between text-sm py-1"><span className="text-gray-400">😟 Apretado</span><span className="text-gray-300">≥ {Math.round(thresholds.t2*100)}%</span></div>
                <div className="flex justify-between text-sm py-1"><span className="text-gray-400">😡 No llegás</span><span className="text-gray-300">&lt; {Math.round(thresholds.t2*100)}%</span></div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* FINANCIAL SUMMARY - tappable values */}
      <Card>
        <p className="text-gray-400 text-sm font-medium mb-3">Resumen financiero</p>
        <div className="grid grid-cols-2 gap-4">
          <Val value={savings} onSave={v=>saveSavings(v)} label="Ahorros actuales" format={fU}/>
          <Val value={targetAmt} onSave={v=>saveCfg({...cfg,targetAmount:v})} label="Meta total" format={fU}/>
          <div>
            <p className="text-xs text-gray-500 mb-0.5">Faltan</p>
            <p className="text-xl font-bold" style={{color:remaining>0?"#fca5a5":"#86efac"}}>{fU(Math.max(0,remaining))}</p>
          </div>
          <div>
            <p className="text-xs text-gray-500 mb-0.5">Colchón proyectado</p>
            <p className="text-xl font-bold" style={{color:surplus>=0?"#86efac":"#fca5a5"}}>{surplus>=0?"+":""}{fU(surplus)}</p>
          </div>
        </div>
      </Card>

      {/* PROGRESS */}
      <Card>
        <div className="flex justify-between text-sm mb-2">
          <span className="text-gray-400">Progreso</span>
          <span className="text-white font-bold">{Math.min(100,Math.round(savings/targetAmt*100))}%</span>
        </div>
        <div className="w-full bg-gray-800 rounded-full h-4 mb-3 overflow-hidden">
          <div className="h-4 rounded-full transition-all relative" style={{width:`${Math.min(100,savings/targetAmt*100)}%`,background:`linear-gradient(90deg, ${mood.color}90, ${mood.color})`}}>
            <div className="absolute inset-0 bg-white/10 rounded-full"/>
          </div>
        </div>
        <div className="flex justify-between text-sm">
          <span className="text-gray-400">Proyección a abril</span>
          <span className="font-bold" style={{color:mood.color}}>{fU(projected)}</span>
        </div>
        <div className="w-full bg-gray-800 rounded-full h-3 mt-2 overflow-hidden">
          <div className="h-3 rounded-full transition-all" style={{width:`${Math.min(100,projected/targetAmt*100)}%`,background:surplus>=0?"#4ade80":"#ef4444"}}/>
        </div>
      </Card>

      {/* CONFIG */}
      <Card>
        <p className="text-gray-400 text-sm font-medium mb-3">Configuración</p>
        <div className="grid grid-cols-2 gap-4">
          <Val value={cfg.salary} onSave={v=>saveCfg({...cfg,salary:v})} label="Sueldo USD/mes" format={fU} size="lg"/>
          <Val value={cfg.dollarRate} onSave={v=>saveCfg({...cfg,dollarRate:v})} label="Dólar (ARS)" format={fA} size="lg"/>
          <Val value={cfg.endYearBonus} onSave={v=>saveCfg({...cfg,endYearBonus:v})} label="Bono fin de año" format={fU} size="lg"/>
          <Val value={cfg.febRaise} onSave={v=>saveCfg({...cfg,febRaise:v})} label="Aumento Feb 27" format={fU} size="lg"/>
        </div>
      </Card>

      {/* THIS MONTH */}
      <Card>
        <p className="text-gray-400 text-sm font-medium mb-2">{MN[now.getMonth()]} {now.getFullYear()} — Este mes</p>
        <div className="grid grid-cols-3 gap-3">
          <div><p className="text-xs text-gray-500">Fijos</p><p className="text-white font-bold">{fA(totalFixedARS)}</p><p className="text-gray-600 text-xs">≈{fU(totalFixedUSD)}</p></div>
          <div><p className="text-xs text-gray-500">Variables</p><p className="text-white font-bold">{fA(totalVarARS)}</p></div>
          <div><p className="text-xs text-gray-500">Total</p><p className="text-white font-bold">{fA(totalMonthARS)}</p><p className="text-gray-600 text-xs">≈{fU(totalMonthUSD)}</p></div>
        </div>
        <div className="mt-3 pt-3 border-t border-gray-800">
          <p className="text-xs text-gray-500">Ahorro estimado este mes</p>
          <p className="text-lg font-bold" style={{color:cfg.salary-totalMonthUSD>600?"#4ade80":"#fbbf24"}}>{fU(Math.max(0,cfg.salary-totalMonthUSD))}</p>
          <p className="text-xs text-gray-600 mt-1">Nota: tus ahorros actuales ya contemplan este mes</p>
        </div>
      </Card>

      {/* TIMELINE */}
      <Card>
        <p className="text-gray-400 text-sm font-medium mb-3">Proyección mes a mes</p>
        {timeline.map((m,i)=>(
          <div key={i} className="mb-3 last:mb-0">
            <div className="flex items-center gap-2 mb-1">
              <span className="text-gray-400 text-xs w-14 shrink-0">{m.label}</span>
              <div className="flex-1 bg-gray-800 rounded-full h-2.5 overflow-hidden">
                <div className="h-full rounded-full transition-all" style={{width:`${Math.min(100,m.accumulated/targetAmt*100)}%`,background:m.accumulated>=targetAmt?"#4ade80":"#fbbf24"}}/>
              </div>
              <span className="text-gray-300 text-xs w-16 text-right font-medium">{fU(m.accumulated)}</span>
            </div>
            <div className="flex gap-1 ml-16 flex-wrap">
              {m.isBonus&&<span className="text-[10px] bg-yellow-900/50 text-yellow-400 px-1.5 py-0.5 rounded-full">🎁 Bono +{fU(cfg.endYearBonus)}</span>}
              {m.hasExtra&&<span className="text-[10px] bg-red-900/50 text-red-400 px-1.5 py-0.5 rounded-full">🎁 {m.extraDesc}</span>}
              {m.hasMonotributo&&i===0&&<span className="text-[10px] bg-orange-900/50 text-orange-400 px-1.5 py-0.5 rounded-full">📋 Monotributo</span>}
              {m.hasRaise&&timeline[i-1]&&!timeline[i-1].hasRaise&&<span className="text-[10px] bg-green-900/50 text-green-400 px-1.5 py-0.5 rounded-full">📈 Aumento</span>}
              <span className="text-[10px] text-gray-600">Ahorro: {fU(m.saved)}</span>
            </div>
          </div>
        ))}
        <div className="border-t border-gray-800 mt-3 pt-2 flex justify-between text-sm">
          <span className="text-gray-500">Meta</span>
          <span className="text-green-400 font-medium">{fU(targetAmt)}</span>
        </div>
      </Card>

      {/* MOVE PROGRESS */}
      <Card>
        <div className="flex justify-between items-center">
          <div><p className="text-gray-500 text-xs">Falta comprar</p><p className="text-white text-xl font-bold">{fU(remainingItemsCost)}</p></div>
          <div className="text-right"><p className="text-gray-500 text-xs">Comprados</p><p className="text-green-400 text-lg font-bold">{purchasedCount}/{MOVE_ITEMS.length}</p></div>
        </div>
      </Card>
    </div>
  );

  const renderGastos=()=>(
    <div className="space-y-4 pb-24">
      <Card>
        <p className="text-gray-400 text-sm mb-1">{MN[now.getMonth()]} {now.getFullYear()}</p>
        <p className="text-white text-2xl font-bold">{fA(totalMonthARS)}</p>
        <p className="text-gray-500 text-xs">≈ {fU(totalMonthUSD)} USD</p>
      </Card>

      <Card>
        <p className="text-gray-300 text-sm font-medium mb-3">Agregar gasto</p>
        <div className="flex gap-2 mb-3">
          {[["uber","🚗 Uber"],["general","🛒 General"]].map(([v,l])=>(
            <button key={v} onClick={()=>setForm(f=>({...f,cat:v}))}
              className={`flex-1 py-2.5 rounded-xl text-sm font-medium transition-all ${form.cat===v?"bg-indigo-600 text-white":"bg-gray-800 text-gray-400"}`}>{l}</button>
          ))}
        </div>
        <input type="number" inputMode="numeric" placeholder="Monto (ARS)" value={form.amount}
          onChange={e=>setForm(f=>({...f,amount:e.target.value}))}
          className="w-full bg-gray-800 text-white rounded-xl px-4 py-3 mb-2 text-lg placeholder-gray-600 border-none outline-none"/>
        <input type="text" placeholder="Descripción (opcional)" value={form.desc}
          onChange={e=>setForm(f=>({...f,desc:e.target.value}))}
          className="w-full bg-gray-800 text-white rounded-xl px-4 py-2.5 mb-3 text-sm placeholder-gray-600 border-none outline-none"/>
        <button onClick={addExpense}
          className="w-full bg-indigo-600 active:bg-indigo-500 text-white py-3 rounded-xl font-medium transition-all active:scale-95">Agregar</button>
      </Card>

      {toast&&<div className="bg-gray-800 border border-gray-700 rounded-xl p-3 text-sm text-gray-300">{toast}</div>}

      {/* FIXED EXPENSES */}
      <Card>
        <button onClick={()=>setFixedOpen(!fixedOpen)} className="w-full flex items-center justify-between text-gray-300 font-medium">
          <span>📌 Gastos fijos ({fA(totalFixedARS)})</span>
          <span className="text-gray-500 transition-transform" style={{transform:fixedOpen?"rotate(180deg)":""}}>▾</span>
        </button>
        {fixedOpen&&(
          <div className="mt-3 space-y-2">
            {activeFixed.map(f=>{
              const paid=fixedPaid[cm]?.[f.id];
              const isCustom=f.id.startsWith("custom-");
              return(
                <div key={f.id} className="flex items-center gap-3 py-2 border-b border-gray-800 last:border-0">
                  <button onClick={()=>toggleFixed(f.id)}
                    className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs transition-all shrink-0 ${paid?"bg-green-600 text-white":"bg-gray-800 border border-gray-600"}`}>
                    {paid&&"✓"}</button>
                  <p className={`flex-1 text-sm ${paid?"text-gray-500 line-through":"text-gray-200"}`}>{f.name}</p>
                  {f.variable?(
                    <input type="number" inputMode="numeric" value={fixedAmts[cm]?.[f.id]??f.amount}
                      onChange={e=>updateFixedAmt(f.id,e.target.value)}
                      className="bg-gray-800 text-white rounded-lg px-2 py-1 w-28 text-sm text-right border-none outline-none"/>
                  ):(
                    <span className="text-gray-400 text-sm">{fA(f.amount)}</span>
                  )}
                  {isCustom&&<button onClick={()=>removeCustomFixed(f.id)} className="text-gray-600 active:text-red-400 text-xs p-1">✕</button>}
                </div>
              );
            })}
            <div className="pt-2 flex justify-between text-sm">
              <span className="text-gray-500">Total en USD</span>
              <span className="text-gray-300">≈{fU(totalFixedUSD)}</span>
            </div>

            {/* ADD CUSTOM FIXED */}
            {addFixedOpen?(
              <div className="pt-3 border-t border-gray-800 space-y-2 slide-up">
                <input type="text" placeholder="Nombre del gasto" value={newFixed.name}
                  onChange={e=>setNewFixed(f=>({...f,name:e.target.value}))}
                  className="w-full bg-gray-800 text-white rounded-xl px-3 py-2 text-sm placeholder-gray-600 border-none outline-none"/>
                <input type="number" inputMode="numeric" placeholder="Monto (ARS)" value={newFixed.amount}
                  onChange={e=>setNewFixed(f=>({...f,amount:e.target.value}))}
                  className="w-full bg-gray-800 text-white rounded-xl px-3 py-2 text-sm placeholder-gray-600 border-none outline-none"/>
                <label className="flex items-center gap-2 text-sm text-gray-400">
                  <input type="checkbox" checked={newFixed.variable} onChange={e=>setNewFixed(f=>({...f,variable:e.target.checked}))}
                    className="rounded"/>
                  Monto variable (cambia cada mes)
                </label>
                <div className="flex gap-2">
                  <button onClick={addCustomFixed} className="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-sm font-medium">Agregar</button>
                  <button onClick={()=>setAddFixedOpen(false)} className="px-4 text-gray-500 text-sm">Cancelar</button>
                </div>
              </div>
            ):(
              <button onClick={()=>setAddFixedOpen(true)}
                className="w-full mt-2 py-2 border border-dashed border-gray-700 rounded-xl text-gray-500 text-sm active:border-indigo-500 active:text-indigo-400 transition-all">
                + Agregar gasto fijo
              </button>
            )}
          </div>
        )}
      </Card>

      {/* EXPENSE LIST */}
      {cmExp.length>0&&(
        <Card>
          <p className="text-gray-400 text-sm font-medium mb-3">Gastos del mes</p>
          {[...cmExp].reverse().map(e=>(
            <div key={e.id} className="flex items-center justify-between py-2 border-b border-gray-800 last:border-0">
              <div className="flex items-center gap-2">
                <span className="text-sm">{e.cat==="uber"?"🚗":"🛒"}</span>
                <div>
                  <p className="text-gray-200 text-sm">{e.desc}</p>
                  <p className="text-gray-600 text-xs">{new Date(e.date).toLocaleDateString("es-AR")}</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-gray-300 text-sm">{fA(e.amount)}</span>
                <button onClick={()=>removeExpense(e.id)} className="text-gray-600 active:text-red-400 p-1 text-xs">✕</button>
              </div>
            </div>
          ))}
          <div className="mt-3 pt-2 border-t border-gray-800">
            {["uber","general"].map(cat=>{
              const t=cmExp.filter(e=>e.cat===cat).reduce((s,e)=>s+e.amount,0);
              if(!t)return null;
              return <div key={cat} className="flex justify-between text-xs py-0.5"><span className="text-gray-500">{cat==="uber"?"🚗 Uber":"🛒 General"}</span><span className="text-gray-400">{fA(t)}</span></div>;
            })}
            <div className="flex justify-between text-sm font-medium pt-1"><span className="text-gray-400">Total variable</span><span className="text-white">{fA(totalVarARS)}</span></div>
          </div>
        </Card>
      )}
    </div>
  );

  const renderMudanza=()=>{
    const rooms=[...new Set(MOVE_ITEMS.map(i=>i.room))];
    return(
      <div className="space-y-4 pb-24">
        <Card>
          <div className="flex justify-between items-center">
            <div><p className="text-gray-500 text-xs">Falta comprar</p><p className="text-white text-2xl font-bold">{fU(remainingItemsCost)}</p></div>
            <div className="text-right"><p className="text-gray-500 text-xs">Progreso</p><p className="text-green-400 text-lg font-bold">{purchasedCount}/{MOVE_ITEMS.length}</p></div>
          </div>
          <div className="w-full bg-gray-800 rounded-full h-2 mt-3">
            <div className="h-2 rounded-full bg-green-500 transition-all" style={{width:`${Math.round(purchasedCount/MOVE_ITEMS.length*100)}%`}}/>
          </div>
        </Card>
        <Card>
          <p className="text-gray-400 text-sm font-medium mb-2">Por prioridad (pendientes)</p>
          {PO.map(p=>{
            const items=MOVE_ITEMS.filter(i=>i.p===p&&!purchased[i.id]);
            const t=items.reduce((s,i)=>s+i.cost,0);
            if(!t)return null;
            return <div key={p} className="flex justify-between text-sm py-1"><span className="text-gray-400">{PL[p]}</span><span className="text-gray-200">{fU(t)}</span></div>;
          })}
        </Card>
        {rooms.map(room=>{
          const items=MOVE_ITEMS.filter(i=>i.room===room);
          const done=items.filter(i=>purchased[i.id]);
          return(
            <Card key={room}>
              <div className="flex justify-between items-center mb-3">
                <p className="text-gray-200 font-medium">{room}</p>
                <span className="text-xs text-gray-500">{done.length}/{items.length}</span>
              </div>
              {items.sort((a,b)=>(purchased[a.id]?1:0)-(purchased[b.id]?1:0)).map(item=>(
                <div key={item.id} className="flex items-center gap-3 py-1.5">
                  <button onClick={()=>togglePurchased(item.id)}
                    className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs shrink-0 transition-all ${purchased[item.id]?"bg-green-600":"bg-gray-800 border border-gray-600"}`}>
                    {purchased[item.id]&&"✓"}</button>
                  <span className={`flex-1 text-sm ${purchased[item.id]?"text-gray-600 line-through":"text-gray-200"}`}>{item.name}</span>
                  <span className={`text-sm ${purchased[item.id]?"text-gray-700":"text-gray-400"}`}>{fU(item.cost)}</span>
                  <span className="text-xs">{item.p==="indispensable"?"🟠":item.p==="ultimo"?"🟧":item.p==="inmobiliaria"?"🔴":"🟢"}</span>
                </div>
              ))}
            </Card>
          );
        })}
      </div>
    );
  };

  const renderEventos=()=>{
    const monthsWithEvents=upcomingMonths.filter(m=>{
      const preset=EXTRAS.filter(e=>e.month===m.key);
      const custom=customEvents[m.key]||[];
      return preset.length>0||custom.length>0;
    });
    return(
      <div className="space-y-4 pb-24">
        <Card>
          <p className="text-gray-300 text-sm font-medium mb-1">📅 Eventos futuros</p>
          <p className="text-gray-500 text-xs">Cargá gastos o ingresos que sabés que vienen — vacaciones, regalos, algo extra — y se reflejan directo en el dashboard.</p>
        </Card>

        <Card>
          <p className="text-gray-300 text-sm font-medium mb-3">Agregar evento</p>
          <div className="mb-2">
            <label className="text-xs text-gray-500 mb-1 block">Mes</label>
            <select value={newEvent.month} onChange={e=>setNewEvent(f=>({...f,month:e.target.value}))}
              className="w-full bg-gray-800 text-white rounded-xl px-3 py-2.5 text-sm border-none outline-none appearance-none">
              <option value="">Elegí un mes</option>
              {upcomingMonths.map(m=><option key={m.key} value={m.key}>{m.label}</option>)}
            </select>
          </div>
          <div className="flex gap-2 mb-2">
            {[["gasto","💸 Gasto"],["ingreso","💰 Ingreso extra"]].map(([v,l])=>(
              <button key={v} onClick={()=>setNewEvent(f=>({...f,type:v}))}
                className={`flex-1 py-2 rounded-xl text-sm font-medium transition-all ${newEvent.type===v?"bg-indigo-600 text-white":"bg-gray-800 text-gray-400"}`}>{l}</button>
            ))}
          </div>
          <input type="text" placeholder="Descripción (ej: Vacaciones)" value={newEvent.desc}
            onChange={e=>setNewEvent(f=>({...f,desc:e.target.value}))}
            className="w-full bg-gray-800 text-white rounded-xl px-3 py-2.5 mb-2 text-sm placeholder-gray-600 border-none outline-none"/>
          <input type="number" inputMode="numeric" placeholder="Monto (ARS)" value={newEvent.amount}
            onChange={e=>setNewEvent(f=>({...f,amount:e.target.value}))}
            className="w-full bg-gray-800 text-white rounded-xl px-3 py-2.5 mb-3 text-sm placeholder-gray-600 border-none outline-none"/>
          <button onClick={addEvent}
            className="w-full bg-indigo-600 active:bg-indigo-500 text-white py-3 rounded-xl font-medium transition-all active:scale-95">
            Agregar evento
          </button>
        </Card>

        {monthsWithEvents.length>0&&(
          <Card>
            <p className="text-gray-400 text-sm font-medium mb-3">Eventos cargados</p>
            {monthsWithEvents.map(m=>{
              const preset=EXTRAS.filter(e=>e.month===m.key);
              const custom=customEvents[m.key]||[];
              return(
                <div key={m.key} className="mb-3 last:mb-0 pb-3 last:pb-0 border-b border-gray-800 last:border-0">
                  <p className="text-gray-300 text-sm font-medium mb-1.5">{m.label}</p>
                  {preset.map((e,i)=>(
                    <div key={`p-${i}`} className="flex items-center justify-between py-1">
                      <span className="text-gray-500 text-sm">🔒 {e.desc}</span>
                      <span className="text-gray-400 text-sm">{fA(e.amount)}</span>
                    </div>
                  ))}
                  {custom.map(e=>(
                    <div key={e.id} className="flex items-center justify-between py-1">
                      <span className={`text-sm ${e.amount<0?"text-green-400":"text-gray-300"}`}>{e.amount<0?"💰":"💸"} {e.desc}</span>
                      <div className="flex items-center gap-2">
                        <span className={`text-sm ${e.amount<0?"text-green-400":"text-gray-300"}`}>{e.amount<0?"+":""}{fA(Math.abs(e.amount))}</span>
                        <button onClick={()=>removeEvent(m.key,e.id)} className="text-gray-600 active:text-red-400 p-1 text-xs">✕</button>
                      </div>
                    </div>
                  ))}
                </div>
              );
            })}
            <p className="text-gray-600 text-xs mt-2">🔒 = evento fijo que ya conocíamos</p>
          </Card>
        )}
      </div>
    );
  };

  const tabs=[{icon:"📊",label:"Dashboard"},{icon:"💸",label:"Gastos"},{icon:"📦",label:"Mudanza"},{icon:"📅",label:"Eventos"}];

  return(
    <div className="min-h-screen bg-gray-950 text-white max-w-lg mx-auto">
      <div className="sticky top-0 z-30 bg-gray-950/95 backdrop-blur-sm border-b border-gray-800 px-4 py-3">
        <div className="flex items-center justify-between">
          <div><h1 className="text-lg font-bold">🏠 Mudanza 2027</h1><p className="text-xs text-gray-500">{monthsLeft} meses para abril</p></div>
          <div className="text-3xl">{mood.emoji}</div>
        </div>
      </div>
      <div className="px-4 pt-4">
        {tab===0&&renderDashboard()}
        {tab===1&&renderGastos()}
        {tab===2&&renderMudanza()}
        {tab===3&&renderEventos()}
      </div>
      <div className="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur-sm border-t border-gray-800 z-30">
        <div className="flex max-w-lg mx-auto">
          {tabs.map((t,i)=>(
            <button key={i} onClick={()=>setTab(i)}
              className={`flex-1 py-2.5 flex flex-col items-center gap-0.5 transition-all ${tab===i?"text-indigo-400":"text-gray-500"}`}>
              <span className="text-lg">{t.icon}</span><span className="text-[10px]">{t.label}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
